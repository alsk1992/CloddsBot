name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify types
        run: npm run typecheck

      - name: Pack CLI
        run: |
          mkdir release
          npm pack --pack-destination release
          cd release
          mv clodds-*.tgz clodds.tgz
          sha256sum clodds.tgz > clodds.tgz.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/clodds.tgz release/clodds.tgz.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/clodds.tgz release/clodds.tgz.sha256 --verify-tag --generate-notes --title "Clodds $GITHUB_REF_NAME"
          fi
