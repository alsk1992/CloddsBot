name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: audit-ci (moderate+) - production only
        run: npx --yes audit-ci --config audit-ci.jsonc --moderate --production

      - name: Check for known vulnerabilities
        run: |
          echo "=== Security Summary (informational — allowlisted findings still shown here) ==="
          npm audit --json | jq '.metadata.vulnerabilities' || true

